<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#161f30">
  <title>ARTStronomy — Star Observatory</title>
  <!-- Self-hosted free Three.js, copied by prepare-cosmic-embed.mjs. -->
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <link rel="stylesheet" href="./fonts/poppins.css">
  <link rel="stylesheet" href="./cosmic-viewport.css">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#020b10}
    #camera-viewport{position:relative;width:100%;height:100dvh;min-height:480px}
    #tracking-camera{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
    #enable-hands{position:fixed;right:28px;bottom:18px;z-index:10;min-height:36px;border:1px solid #9cc0ab66;border-radius:4px;background:#11221e;color:#e2e6cb;font:12px "Poppins",sans-serif;padding:0 12px;cursor:pointer}
    @media(max-width:600px){#enable-hands{right:12px;bottom:5px;min-height:24px;font-size:11px}}
  </style>
</head>
<body>
  <!-- 1. HTML container: change its dimensions to embed in your camera panel. -->
  <div id="camera-viewport"></div>
  <!-- Camera is used only as a hand input. The artwork fills the viewport. -->
  <video id="tracking-camera" autoplay muted playsinline aria-hidden="true"></video>
  <button id="enable-hands" type="button">Enable hand tracking</button>
  <!-- 3. JS setup: relative paths work in a GitHub Pages repository subfolder. -->
  <script type="module">
    import { mountCosmicViewport } from './cosmic-viewport.js';
    import { creatorData } from './creators.js';
    import { startHandTracking } from './hand-tracking.js';
    const view = mountCosmicViewport(document.querySelector('#camera-viewport'), { creators: creatorData });
    const video = document.querySelector('#tracking-camera');
    const button = document.querySelector('#enable-hands');
    let stream, tracker, closed = false, starting = false;
    button.addEventListener('click', async () => {
      if (starting) return;
      if (stream) { tracker?.stop(); tracker=null; stream.getTracks().forEach(t=>t.stop()); stream=null; video.srcObject=null; view.setTrackingStatus('Camera off · mouse & touch ready'); button.textContent='Enable hand tracking'; return; }
      starting=true;button.disabled=true;button.textContent='Starting camera…';
      try {
        stream=await navigator.mediaDevices.getUserMedia({ video: { facingMode:'user',width:{ideal:640},height:{ideal:480} }, audio:false });
        if (closed) { stream.getTracks().forEach(t=>t.stop());return; }
        video.srcObject=stream; await video.play();
        tracker=await startHandTracking({video,mirrored:true,assetRoot:'./mediapipe',visionModule:import('./vendor/vision_bundle.mjs'),onHand:view.setHand,onStatus:view.setTrackingStatus});
        if(closed){tracker.stop();return;}
        button.textContent='Camera off';
      } catch { stream?.getTracks().forEach(t=>t.stop());stream=null;view.setTrackingStatus('Camera unavailable · mouse & touch ready');button.textContent='Retry hand tracking'; }
      finally {starting=false;button.disabled=false;}
    });
    function cleanup(){closed=true;tracker?.stop();stream?.getTracks().forEach(t=>t.stop());view.destroy();}
    window.addEventListener('pagehide', cleanup, {once:true});
    window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
  </script>
</body>
</html>
